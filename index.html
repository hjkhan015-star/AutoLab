<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<meta name="description" content="Interactive 3D automotive learning lab.">
<meta name="author" content="Hassan J Khan">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto Lab">
<title>Auto Lab</title>

<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" crossorigin>
<link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js" crossorigin>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0a0d13;
  --bg-elev:#141a26;
  --panel:rgba(20,26,38,.82);
  --accent:#38bdf8;
  --accent-2:#a855f7;
  --text:#e8edf7;
  --text-dim:#94a3b8;
  --text-dimmer:#64748b;
  --border:rgba(148,163,184,.12);
  --border-bright:rgba(148,163,184,.24);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  --shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --radius:12px;
  --radius-lg:16px;
  --radius-pill:999px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --ease:cubic-bezier(.32,.72,0,1);
}

html.light-theme{
  --bg:#e8ecf3;
  --bg-elev:#f0f3f8;
  --panel:rgba(255,255,255,.95);
  --accent:#2563eb;
  --accent-2:#7c3aed;
  --text:#0a0d13;
  --text-dim:#475569;
  --text-dimmer:#64748b;
  --border:rgba(15,23,42,.10);
  --border-bright:rgba(15,23,42,.20);
  --shadow-lg:0 12px 40px rgba(15,23,42,.15);
  --shadow-sm:0 4px 16px rgba(15,23,42,.10);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html{
  width:100%;height:100%;height:100dvh;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  transition:background-color .28s ease,color .28s ease;
}

body{
  position:fixed;inset:0;
  width:100%;height:100%;height:100dvh;
  overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:inherit;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  transition:background-color .28s ease,color .28s ease;
}

button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ═══════════════════════════════════════════════════════════════
   HOME SCREEN
   ═══════════════════════════════════════════════════════════════ */
#home-screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  transition:transform .42s var(--ease),opacity .42s var(--ease),filter .42s var(--ease);
  transform-origin:center top;
  z-index:1;
  overflow:hidden;
}
#home-screen.behind{
  transform:scale(.94) translateY(8px);
  opacity:0;
  filter:blur(8px);
  pointer-events:none;
}

.home-header{
  padding:calc(14px + var(--safe-t)) 18px 10px;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--bg) 100%,transparent) 0%,
    color-mix(in srgb,var(--bg) 85%,transparent) 80%,
    transparent 100%);
  flex:0 0 auto;
  z-index:5;
}
.header-row{
  display:flex;align-items:center;gap:12px;
  margin-bottom:14px;
}
.brand-mark{
  width:40px;height:40px;flex:0 0 auto;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#0a0d13;
  display:grid;place-items:center;
  box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 32%,transparent);
  position:relative;
  overflow:hidden;
}
.brand-mark::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);
  transform:translateX(-120%);
  animation:sheen 3.2s var(--ease) infinite;
}
@keyframes sheen{
  0%,60%{transform:translateX(-120%)}
  100%{transform:translateX(120%)}
}
.brand-mark svg{width:24px;height:24px}
.brand-copy{flex:1;min-width:0}
.brand-title{
  font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.1;
  display:flex;align-items:baseline;gap:6px;
}
.brand-title .brand-dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
  display:inline-block;
  transform:translateY(-3px);
}
.brand-sub{
  font-size:11.5px;color:var(--text-dimmer);
  margin-top:3px;font-weight:500;
}
#install-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:11px;
  border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);
  color:var(--accent);
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;
  transition:background .18s,transform .12s;
}
#install-btn:active{transform:scale(.95)}
#install-btn svg{width:14px;height:14px}
#install-btn[hidden]{display:none}

.search-wrap{
  position:relative;
  display:flex;align-items:center;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  border-radius:13px;
  height:42px;
  padding:0 14px;
  transition:background .18s,border-color .18s,box-shadow .18s;
}
html.light-theme .search-wrap{background:rgba(15,23,42,.05)}
.search-wrap:focus-within{
  background:rgba(255,255,255,.08);
  border-color:color-mix(in srgb,var(--accent) 40%,transparent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent);
}
html.light-theme .search-wrap:focus-within{background:rgba(15,23,42,.08)}
.search-wrap svg{
  width:16px;height:16px;color:var(--text-dimmer);flex:0 0 auto;
  margin-right:10px;
}
.search-wrap input{
  flex:1;background:transparent;border:0;
  color:var(--text);font-weight:500;
  font-size:15px;
  outline:none;min-width:0;
  font-family:inherit;
}
.search-wrap input::placeholder{color:var(--text-dimmer);font-weight:400}

@media (max-width: 720px) {
  .search-wrap input { font-size: 16px; }
}

.home-main{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:6px 0 calc(96px + var(--safe-b));
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.home-main::-webkit-scrollbar{display:none}

.section-title{
  padding:16px 18px 8px;
  font-size:12.5px;font-weight:700;
  letter-spacing:.04em;
  color:var(--text-dim);
  text-transform:uppercase;
}

.module-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:0 18px;
}
@media (min-width:520px){
  .module-grid{grid-template-columns:repeat(3,1fr);gap:14px}
}
@media (min-width:768px){
  .module-grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .home-main{padding-bottom:32px}
  #home-screen .home-main{max-width:1100px;margin:0 auto;width:100%}
  .home-header{max-width:1100px;margin:0 auto;width:100%}
}
@media (min-width:1200px){
  .module-grid{grid-template-columns:repeat(6,1fr)}
}

.module-card{
  position:relative;
  aspect-ratio:1;
  border-radius:20px;
  background:
    linear-gradient(160deg,
      color-mix(in srgb,var(--c) 20%,transparent) 0%,
      color-mix(in srgb,var(--c) 6%,transparent) 100%);
  border:1px solid color-mix(in srgb,var(--c) 22%,transparent);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
  padding:12px 8px;
  cursor:pointer;
  transition:transform .18s var(--ease),border-color .18s,box-shadow .18s,background .18s;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
html.light-theme .module-card{
  background:
    linear-gradient(160deg,
      color-mix(in srgb,var(--c) 14%,white) 0%,
      color-mix(in srgb,var(--c) 4%,white) 100%);
}
.module-card::before{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,
    color-mix(in srgb,var(--c) 30%,transparent) 0%,
    transparent 65%);
  opacity:.5;
  transition:opacity .25s;
  pointer-events:none;
}
.module-card:hover{
  border-color:color-mix(in srgb,var(--c) 45%,transparent);
  box-shadow:0 12px 40px -12px color-mix(in srgb,var(--c) 55%,transparent);
}
.module-card:hover::before{opacity:.9}
.module-card:active{transform:scale(.94)}

.module-card .card-icon{
  position:relative;
  width:36px;height:36px;
  color:var(--c);
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--c) 55%,transparent));
  z-index:1;
}
.module-card .card-icon svg{width:100%;height:100%;display:block}
.module-card .card-label{
  position:relative;
  font-size:12.5px;font-weight:700;
  color:var(--text);
  text-align:center;line-height:1.2;
  letter-spacing:-.01em;
  z-index:1;
}
.module-card .card-sub{
  position:relative;
  font-size:10px;font-weight:500;
  color:var(--text-dimmer);
  text-align:center;
  line-height:1.2;
  z-index:1;
  margin-top:-3px;
}

.recent-list{
  display:flex;flex-direction:column;gap:8px;
  padding:0 18px;
}
.recent-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  cursor:pointer;
  transition:background .15s,border-color .15s,transform .12s;
  touch-action:manipulation;
}
html.light-theme .recent-item{background:rgba(15,23,42,.04)}
.recent-item:active{transform:scale(.98);background:rgba(255,255,255,.08)}
.recent-item .r-icon{
  width:36px;height:36px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:11px;
  background:color-mix(in srgb,var(--c) 16%,transparent);
  color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
}
.recent-item .r-icon svg{width:22px;height:22px}
.recent-item .r-copy{flex:1;min-width:0}
.recent-item .r-title{
  font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recent-item .r-sub{
  font-size:11.5px;color:var(--text-dimmer);
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recent-item .r-arrow{
  color:var(--text-dimmer);flex:0 0 auto;
}
.recent-item .r-arrow svg{width:16px;height:16px}

.empty-state{
  padding:60px 40px;
  text-align:center;
  color:var(--text-dimmer);
}
.empty-state svg{
  width:52px;height:52px;opacity:.35;
  margin-bottom:16px;
}
.empty-state .e-title{
  font-size:15px;font-weight:700;color:var(--text-dim);
  margin-bottom:6px;
}
.empty-state .e-body{
  font-size:13px;line-height:1.5;
  max-width:280px;margin:0 auto;
}

/* ─── About ─────────────────────────────────────────────── */
.about-content{
  padding:8px 18px 40px;
  max-width:640px;margin:0 auto;
}
.about-hero{
  position:relative;
  border-radius:22px;
  padding:26px 22px 24px;
  margin-bottom:14px;
  background:
    radial-gradient(140% 120% at 0% 0%,
      color-mix(in srgb,var(--accent) 22%,transparent) 0%,
      transparent 55%),
    radial-gradient(140% 120% at 100% 100%,
      color-mix(in srgb,var(--accent-2) 22%,transparent) 0%,
      transparent 55%),
    rgba(255,255,255,.03);
  border:1px solid var(--border);
  overflow:hidden;
}
html.light-theme .about-hero{
  background:
    radial-gradient(140% 120% at 0% 0%,
      color-mix(in srgb,var(--accent) 16%,white) 0%,
      transparent 55%),
    radial-gradient(140% 120% at 100% 100%,
      color-mix(in srgb,var(--accent-2) 14%,white) 0%,
      transparent 55%),
    #fff;
}
.about-hero .ah-eyebrow{
  font-size:10.5px;font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.about-hero h2{
  font-size:22px;font-weight:800;
  letter-spacing:-.025em;
  line-height:1.15;
  margin-bottom:10px;
}
.about-hero p{
  font-size:13.5px;line-height:1.6;
  color:var(--text-dim);
  max-width:440px;
}
.about-hero .ah-tags{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-top:16px;
}
.about-hero .ah-tag{
  font-size:10.5px;font-weight:700;
  padding:5px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 14%,transparent);
  color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  letter-spacing:.01em;
}

.about-card{
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:14px;
}
html.light-theme .about-card{background:rgba(15,23,42,.04)}
.about-card h3{
  font-size:16px;font-weight:800;
  margin-bottom:8px;letter-spacing:-.01em;
}
.about-card p{
  font-size:13.5px;line-height:1.6;
  color:var(--text-dim);
}
.about-card p + p{margin-top:10px}
.about-card strong{color:var(--text);font-weight:700}

/* Maker signature card */
.maker-card{
  position:relative;
  display:flex;align-items:center;gap:16px;
  padding:20px;
  border-radius:20px;
  margin-bottom:14px;
  background:
    linear-gradient(135deg,
      color-mix(in srgb,var(--accent) 12%,transparent) 0%,
      color-mix(in srgb,var(--accent-2) 10%,transparent) 100%);
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  overflow:hidden;
}
html.light-theme .maker-card{
  background:
    linear-gradient(135deg,
      color-mix(in srgb,var(--accent) 10%,white) 0%,
      color-mix(in srgb,var(--accent-2) 8%,white) 100%);
}
.maker-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 100% 0%,
      color-mix(in srgb,var(--accent-2) 30%,transparent) 0%,
      transparent 50%);
  pointer-events:none;
  opacity:.6;
}
.maker-avatar{
  position:relative;
  width:54px;height:54px;flex:0 0 auto;
  border-radius:16px;
  display:grid;place-items:center;
  font-size:20px;font-weight:900;
  letter-spacing:-.04em;
  color:#0a0d13;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);
  z-index:1;
}
.maker-copy{
  position:relative;
  flex:1;min-width:0;
  z-index:1;
}
.maker-role{
  font-size:10.5px;font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:4px;
}
.maker-name{
  font-size:18px;font-weight:800;
  letter-spacing:-.02em;
  line-height:1.15;
  color:var(--text);
}
.maker-tag{
  font-size:12px;color:var(--text-dim);
  margin-top:4px;
  line-height:1.4;
}

.about-credits{
  text-align:center;
  padding:24px 20px 0;
  font-size:11.5px;color:var(--text-dimmer);
  line-height:1.7;
}
.about-credits .dot{
  display:inline-block;
  width:3px;height:3px;
  border-radius:50%;
  background:var(--text-dimmer);
  margin:0 6px;
  transform:translateY(-3px);
  opacity:.5;
}
.about-credits .sig{
  font-weight:700;
  color:var(--text-dim);
  letter-spacing:.01em;
}

#bottom-nav{
  position:absolute;
  bottom:0;left:0;right:0;
  display:flex;
  align-items:stretch;
  padding:6px 10px calc(6px + var(--safe-b));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--border);
  z-index:50;
}
@media (min-width:768px){
  #bottom-nav{
    max-width:640px;margin:0 auto;
    border-radius:22px 22px 0 0;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
}

.nav-tab{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;
  padding:8px 4px;
  color:var(--text-dimmer);
  font-size:10.5px;font-weight:700;
  letter-spacing:.01em;
  border-radius:12px;
  transition:color .18s var(--ease),background .18s var(--ease);
  position:relative;
  touch-action:manipulation;
}
.nav-tab svg{width:22px;height:22px;transition:transform .2s var(--ease)}
.nav-tab.active{color:var(--accent)}
.nav-tab.active svg{transform:translateY(-1px)}
.nav-tab:active{background:rgba(255,255,255,.05)}

/* ═══════════════════════════════════════════════════════════════
   MODULE SCREEN
   ═══════════════════════════════════════════════════════════════ */
#module-screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .42s var(--ease);
  background:var(--bg);
  z-index:100;
  overflow:hidden;
  will-change:transform;
}
#module-screen.active{transform:translateX(0)}

.floating-btn{
  position:absolute;
  top:calc(10px + var(--safe-t));
  width:42px;height:42px;
  flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:13px;
  background:color-mix(in srgb,var(--bg-elev) 88%,transparent);
  border:1px solid var(--border-bright);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--shadow-sm);
  color:var(--text);
  z-index:22;
  transition:background .15s,transform .1s;
  touch-action:manipulation;
}
.floating-btn:hover{background:color-mix(in srgb,var(--bg-elev) 100%,transparent)}
.floating-btn:active{transform:scale(.92)}
.floating-btn svg{width:20px;height:20px}

#btn-back{left:calc(10px + var(--safe-l))}
#btn-more{right:calc(10px + var(--safe-r))}

.module-head-copy{display:none}

#module-frame-host{
  position:absolute;inset:0;
  background:var(--bg);
}
#module-frame-host iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:0;
  background:var(--bg);
  display:none;
}
#module-frame-host iframe.active{display:block}

/* ═══════════════════════════════════════════════════════════════
   FLOATING CONTROLS PILL
   ═══════════════════════════════════════════════════════════════ */
#module-pill{
  position:absolute;
  left:50%;
  bottom:calc(14px + var(--safe-b));
  transform:translateX(-50%);
  display:flex;align-items:center;gap:3px;
  padding:5px;
  background:color-mix(in srgb,var(--bg-elev) 88%,transparent);
  border:1px solid var(--border-bright);
  border-radius:18px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow-lg);
  z-index:25;
  max-width:calc(100% - 20px);
  overflow-x:auto;
  scrollbar-width:none;
  transition:transform .32s var(--ease),opacity .28s;
}
#module-pill::-webkit-scrollbar{display:none}
#module-pill.hidden{
  transform:translateX(-50%) translateY(120%);
  opacity:0;pointer-events:none;
}

.pill-btn{
  width:38px;height:38px;flex:0 0 auto;
  border-radius:13px;
  display:grid;place-items:center;
  color:var(--text);
  background:transparent;
  transition:background .14s,transform .08s,color .14s;
  touch-action:manipulation;
}

.pill-speed{

   ═══════════════════════════════════════════════════════════════ */
#sheet-backdrop{

<script>
(function(){
'use strict';

/* ─── DOM refs ────────────────────────────────────────────── */
const modules       = window.AUTO_MODULES || [];
const homeScreen    = document.getElementById('home-screen');
const homeMain      = document.getElementById('home-main');
const bottomNav     = document.getElementById('bottom-nav');
const searchInput   = document.getElementById('search-input');
const installBtnEl  = document.getElementById('install-btn');
const moduleCountEl = document.getElementById('module-count');
const moduleScreen  = document.getElementById('module-screen');
const frameHost     = document.getElementById('module-frame-host');
const mTitleEl      = document.getElementById('m-title');
const mSubEl        = document.getElementById('m-sub');
const btnBack       = document.getElementById('btn-back');
const btnMore       = document.getElementById('btn-more');
const pillPlay      = document.getElementById('pill-play');
const pillReset     = document.getElementById('pill-reset');
const pillMore      = document.getElementById('pill-more');
const pillSpeed     = document.getElementById('pill-speed');
const pillIconPlay  = document.getElementById('pill-icon-play');
const pillIconPause = document.getElementById('pill-icon-pause');
const pillTheme     = document.getElementById('pill-theme');
const pillIconMoon  = document.getElementById('pill-icon-moon');
const pillIconSun   = document.getElementById('pill-icon-sun');
const pillWire      = document.getElementById('pill-wire');
const pillXRay      = document.getElementById('pill-xray');
const sheetBackdrop = document.getElementById('sheet-backdrop');
const bottomSheet   = document.getElementById('bottom-sheet');
const sheetContent  = document.getElementById('sheet-content');
const bootLoader    = document.getElementById('boot-loader');

/* ─── Prefs + state ──────────────────────────────────────── */
const PREF_KEY = 'autolab.prefs';
function loadPrefs() {
  try { const raw = localStorage.getItem(PREF_KEY); return raw ? JSON.parse(raw) : null; }
  catch(_) { return null; }
}
function detectSystemTheme() {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  } catch(_) {}
  return 'dark';
}
const savedPrefs = loadPrefs() || {};

const state = {
  tab: 'home',
  active: null,
  playing: true,
  speed: parseFloat(pillSpeed.value),
  labels: true,
  gas: true,
  theme:     savedPrefs.theme     || detectSystemTheme(),
  wireframe: !!savedPrefs.wireframe,
  xray:      !!savedPrefs.xray,
  recents: loadRecents()
};
const iframes = Object.create(null);

function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      theme: state.theme, wireframe: state.wireframe, xray: state.xray
    }));
  } catch(_) {}
}

function loadRecents(){
  try{
    const raw = localStorage.getItem('autolab.recents');
    if(!raw) return [];
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    return arr.filter(id => modules.some(m => m.id === id)).slice(0, 6);
  }catch(_){ return []; }
}
function pushRecent(id){
  const arr = state.recents.filter(x => x !== id);
  arr.unshift(id);
  state.recents = arr.slice(0, 6);
  try{ localStorage.setItem('autolab.recents', JSON.stringify(state.recents)); }catch(_){}
}

/* ═══════════════════════════════════════════════════════════════
   EMBED FIX — injects into each module iframe to keep the shell
   chrome from colliding with module-owned UI.
   ═══════════════════════════════════════════════════════════════ */
function injectEmbedFix(fr){
  try{
    const doc = fr.contentDocument;
    if(!doc) return;
    if(doc.body) doc.body.classList.add('embedded');
    try {
      doc.documentElement.classList.toggle('light-theme', state.theme === 'light');
      doc.body.classList.toggle('light-theme', state.theme === 'light');
    } catch(_) {}

    const old = doc.getElementById('shell-embed-fix');
    if (old) old.remove();

    const btnEl  = document.getElementById('btn-back');
    const pillEl = document.getElementById('module-pill');
    const btnRect  = btnEl  ? btnEl.getBoundingClientRect()  : { width: 42, height: 42 };
    const pillRect = pillEl ? pillEl.getBoundingClientRect() : { height: 48 };

    const safeT = 'env(safe-area-inset-top, 0px)';
    const safeB = 'env(safe-area-inset-bottom, 0px)';
    const safeL = 'env(safe-area-inset-left, 0px)';
    const safeR = 'env(safe-area-inset-right, 0px)';

    const sideInset = Math.ceil(btnRect.width + 16);
    const botInset  = Math.ceil(pillRect.height + 16);
    const topInset  = 10;

    const isNarrow = window.matchMedia('(max-width: 720px)').matches;
    const lr = isNarrow ? '10px' : `${sideInset}px`;

    const s = doc.createElement('style');
    s.id = 'shell-embed-fix';
    s.textContent = `
      #hint{display:none!important}

      body.embedded #module-controls #btn-play,
      body.embedded #module-controls #btn-reset,
      body.embedded #module-controls .slider-group,
      body.embedded #module-controls #chk-labels,
      body.embedded #module-controls #chk-gas {
        display:none!important;
      }

      body.embedded #module-controls {
        position:absolute!important;
        bottom:calc(${botInset}px + ${safeB})!important;
        left:50%!important;
        transform:translateX(-50%)!important;
        display:flex!important;
        align-items:center!important;
        justify-content:center!important;

/* ─── Lazy iframe ────────────────────────────────────────── */
function ensureIframe(mod){
  if(iframes[mod.id]) return iframes[mod.id];
  const fr = document.createElement('iframe');
  fr.title = mod.title;
  fr.dataset.module = mod.id;
  fr.loading = 'eager';
  fr.setAttribute('allow','autoplay; fullscreen');
  fr.srcdoc = window.AUTO_MODULE_HTML[mod.id] || '';
  fr.addEventListener('load', () => {
    injectEmbedFix(fr);
    const nudge = () => {
      try{ fr.contentWindow.dispatchEvent(new Event('resize')); }catch(_){}
      try{
        if(fr.contentWindow.document)
          fr.contentWindow.document.dispatchEvent(new Event('resize'));
      }catch(_){}
    };
    nudge();
    setTimeout(nudge, 80);
    setTimeout(nudge, 320);
    sendAllCommands(mod.id);
  });
  frameHost.appendChild(fr);
  iframes[mod.id] = fr;
  return fr;
}

/* ─── Messaging ──────────────────────────────────────────── */
function postTo(id, msg){
  const fr = iframes[id];
  if(!fr || !fr.contentWindow) return;
  try{
    fr.contentWindow.postMessage(
      Object.assign({source:'auto-shell', moduleId:id}, msg), '*');
  }catch(_){}
}
function sendAllCommands(id){
  const fr = iframes[id];
  if(!fr) return;
  const win = fr.contentWindow;
  if(!win) return;
  let ready = false;
  try{ ready = !!(win.document && win.document.body); }catch(_){}
  if(!ready){
    fr.addEventListener('load', () => sendAllCommands(id), {once:true});
    return;
  }
  postTo(id, {type:'command', action:'setPlaying',   value: state.playing});
  postTo(id, {type:'command', action:'setSpeed',     value: state.speed});
  postTo(id, {type:'command', action:'setLabels',    value: state.labels});
  postTo(id, {type:'command', action:'setGas',       value: state.gas});
  postTo(id, {type:'command', action:'setTheme',     value: state.theme});
  postTo(id, {type:'command', action:'setWireframe', value: state.wireframe});
  postTo(id, {type:'command', action:'setXRay',      value: state.xray});
}

/* ─── SVG helper ─────────────────────────────────────────── */
function svgWrap(inner){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');
  s.setAttribute('fill','none');
  s.setAttribute('stroke','currentColor');
  s.setAttribute('stroke-width','1.7');
  s.setAttribute('stroke-linecap','round');
  s.setAttribute('stroke-linejoin','round');
  s.innerHTML = inner || '';
  return s;
}

/* ─── Home rendering ─────────────────────────────────────── */
function renderHome(tab){
  state.tab = tab;
  document.querySelectorAll('.nav-tab').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  homeMain.innerHTML = '';

  if(tab === 'home')         renderAllModules();
  else if(tab === 'recents') renderRecents();
  else if(tab === 'about')   renderAbout();
}

function buildCard(mod){
  const card = document.createElement('button');
  card.className = 'module-card';
  card.style.setProperty('--c', mod.color || 'var(--accent)');
  card.setAttribute('aria-label', mod.title);

  const iconBox = document.createElement('div');
  iconBox.className = 'card-icon';
  iconBox.appendChild(svgWrap(mod.icon || ''));
  card.appendChild(iconBox);

  const lbl = document.createElement('div');
  lbl.className = 'card-label';
  lbl.textContent = mod.label || mod.title;
  card.appendChild(lbl);

  const sub = document.createElement('div');
  sub.className = 'card-sub';
  sub.textContent = (mod.subtitle || '').split('·')[0].trim();
  card.appendChild(sub);

  card.addEventListener('click', () => openModule(mod.id));
  return card;
}

function renderAllModules(){
  const q = (searchInput.value || '').trim().toLowerCase();
  const filtered = q
    ? modules.filter(m =>
        m.title.toLowerCase().includes(q) ||
        (m.subtitle || '').toLowerCase().includes(q) ||
        (m.label || '').toLowerCase().includes(q))
    : modules;

  if(state.recents.length && !q){
    const st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = 'Jump back in';
    homeMain.appendChild(st);
    const list = document.createElement('div');
    list.className = 'recent-list';
    state.recents.slice(0, 2).forEach(id => {
      const m = modules.find(x => x.id === id);
      if(!m) return;
      list.appendChild(buildRecentItem(m));
    });
    homeMain.appendChild(list);
  }

  const st2 = document.createElement('div');
  st2.className = 'section-title';
  st2.textContent = q ? `Results (${filtered.length})` : 'All modules';
  homeMain.appendChild(st2);

  if(!filtered.length){
    homeMain.appendChild(buildEmptyState(
      'No matches',
      `Nothing found for "${searchInput.value}". Try another word.`
    ));
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'module-grid';
  filtered.forEach(m => grid.appendChild(buildCard(m)));
  homeMain.appendChild(grid);
}

function buildRecentItem(mod){
  const el = document.createElement('button');

  iconBox.appendChild(svgWrap(mod.icon || ''));

  const copy = document.createElement('div');
  copy.className = 'r-copy';
  const t = document.createElement('div');
  t.className = 'r-title';
  t.textContent = mod.title;
  const s = document.createElement('div');
  s.className = 'r-sub';
  s.textContent = mod.subtitle || '';

  arrow.appendChild(svgWrap('<path d="M9 6l6 6-6 6"/>'));

/* ─── Theme ──────────────────────────────────────────────── */
function applyShellTheme() {
  const isLight = state.theme === 'light';
  document.documentElement.classList.toggle('light-theme', isLight);
  document.body.classList.toggle('light-theme', isLight);
  try {
    document.querySelector('meta[name="theme-color"]').setAttribute(
      'content', isLight ? '#e8ecf3' : '#0a0d13'
    );
  } catch(_) {}
  if (pillIconMoon) pillIconMoon.style.display = isLight ? 'none'  : 'block';
  if (pillIconSun)  pillIconSun.style.display  = isLight ? 'block' : 'none';
  pillTheme.classList.toggle('active', isLight);
}

function setTheme(t) {
  state.theme = (t === 'light') ? 'light' : 'dark';
  applyShellTheme();
  savePrefs();
  if (state.active) postTo(state.active, {type:'command', action:'setTheme', value: state.theme});
}
function setWireframe(v) {
  v = !!v;
  if (v === state.wireframe) return;
  state.wireframe = v;
  if (v) state.xray = false;
  savePrefs();
  pillWire.classList.toggle('active', state.wireframe);
  pillXRay.classList.toggle('active', state.xray);
  if (state.active) {
    postTo(state.active, {type:'command', action:'setWireframe', value: state.wireframe});
    postTo(state.active, {type:'command', action:'setXRay',      value: state.xray});
  }
}
function setXRay(v) {
  v = !!v;
  if (v === state.xray) return;
  state.xray = v;
  if (v) state.wireframe = false;
  savePrefs();
  pillWire.classList.toggle('active', state.wireframe);
  pillXRay.classList.toggle('active', state.xray);
  if (state.active) {
    postTo(state.active, {type:'command', action:'setWireframe', value: state.wireframe});
    postTo(state.active, {type:'command', action:'setXRay',      value: state.xray});
  }
}

/* ─── Open / close module ───────────────────────────────── */
function openModule(id){
  const mod = modules.find(m => m.id === id);
  if(!mod) return;
  state.active = id;
  pushRecent(id);

  for(const k in iframes){
    if(k !== id) postTo(k, {type:'command', action:'setPlaying', value:false});
  }

  ensureIframe(mod);
  for(const k in iframes) iframes[k].classList.toggle('active', k === id);

  if (mTitleEl) mTitleEl.textContent = mod.title;
  if (mSubEl)   mSubEl.textContent   = mod.subtitle || '';

  moduleScreen.classList.add('active');
  moduleScreen.setAttribute('aria-hidden','false');
  homeScreen.classList.add('behind');

  document.title = mod.title + ' — Auto Lab';
  try{ if(location.hash.slice(1) !== id) history.pushState(null,'','#'+id); }catch(_){}

  sendAllCommands(id);
  updatePlayIcon();

  const fr = iframes[id];
  if(fr && fr.contentWindow){
    setTimeout(() => {
      try{ fr.contentWindow.dispatchEvent(new Event('resize')); }catch(_){}
      try{
        if(fr.contentWindow.document)
          fr.contentWindow.document.dispatchEvent(new Event('resize'));
      }catch(_){}
    }, 60);
  }
  closeSheet();
}

function closeModule(){
  if(!state.active) return;
  const id = state.active;
  postTo(id, {type:'command', action:'setPlaying', value:false});

  // ── FIX: clear the `active` class on the iframe so the perf-guard
  //        correctly pauses its render loop while it's hidden.
  if (iframes[id]) iframes[id].classList.remove('active');

  moduleScreen.classList.remove('active');
  moduleScreen.setAttribute('aria-hidden','true');
  homeScreen.classList.remove('behind');
  state.active = null;
  document.title = 'Auto Lab';
  try{ history.replaceState(null,'',' '); }catch(_){}
  closeSheet();
}

btnBack.addEventListener('click', () => {
  if(history.state !== null) history.back();
  else closeModule();
});

window.addEventListener('popstate', () => {
  const id = location.hash.slice(1);
  if(id && modules.some(m => m.id === id)){
    if(state.active !== id) openModule(id);
  } else {
    closeModule();
  }
});

/* ─── Bottom sheet ──────────────────────────────────────── */

pillMore.addEventListener('click', openSheet);
btnMore.addEventListener('click', openSheet);
sheetBackdrop.addEventListener('click', closeSheet);

(function(){
  let startY = 0, curY = 0, dragging = false;
  bottomSheet.addEventListener('touchstart', e => {
    if(bottomSheet.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    dragging = true;
    bottomSheet.style.transition = 'none';
  }, {passive:true});
  bottomSheet.addEventListener('touchmove', e => {
    if(!dragging) return;
    curY = e.touches[0].clientY;
    const dy = Math.max(0, curY - startY);
    bottomSheet.style.transform = `translateY(${dy}px)`;
  }, {passive:true});
  bottomSheet.addEventListener('touchend', () => {
    if(!dragging) return;
    dragging = false;
    bottomSheet.style.transition = '';
    bottomSheet.style.transform = '';
    if(curY - startY > 100) closeSheet();
    startY = curY = 0;
  });
})();

  });
  sheetContent.querySelector('#toggle-theme').addEventListener('click', (e) => {
    const next = state.theme === 'light' ? 'dark' : 'light';
    setTheme(next);
    e.currentTarget.classList.toggle('on', next === 'light');
  });
  sheetContent.querySelector('#toggle-wire').addEventListener('click', (e) => {
    setWireframe(!state.wireframe);
    e.currentTarget.classList.toggle('on', state.wireframe);
    sheetContent.querySelector('#toggle-xray').classList.toggle('on', state.xray);
  });
  sheetContent.querySelector('#toggle-xray').addEventListener('click', (e) => {
    setXRay(!state.xray);
    e.currentTarget.classList.toggle('on', state.xray);
    sheetContent.querySelector('#toggle-wire').classList.toggle('on', state.wireframe);
  });

  sheetContent.querySelector('#sheet-reset').addEventListener('click', () => {
    if(state.active) postTo(state.active, {type:'command', action:'reset'});
    closeSheet();
  });

  buildSheetExtras(mod);
}

function buildSheetExtras(mod){
  const section = document.getElementById('extras-section');
  const grid = document.getElementById('extras-grid');
  if(!section || !grid) return;
  const id = mod.id;
  let hasExtras = false;

  if(id === 'engine'){
    hasExtras = true;
    const strokes = [
      {label:'Intake',      v:0, c:'#38bdf8'},
      {label:'Compression', v:1, c:'#818cf8'},
      {label:'Power',       v:2, c:'#f97316'},
      {label:'Exhaust',     v:3, c:'#94a3b8'}
    ];
    strokes.forEach(s => {
      const b = document.createElement('button');
      b.className = 'extra-btn';
      b.style.setProperty('--c', s.c);
      b.innerHTML = `<span class="eb-num">${s.v+1}</span>${s.label}`;
      b.addEventListener('click', () => {
        grid.querySelectorAll('.extra-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        postTo('engine', {type:'command', action:'setStroke', value:s.v});
        closeSheet();
      });
      grid.appendChild(b);
    });
  }
  else if(id === 'gearbox'){
    hasExtras = true;
    const gears = [
      {label:'Neutral', v:0, c:'#94a3b8'},
      {label:'1st',     v:1, c:'#22c55e'},
      {label:'2nd',     v:2, c:'#22c55e'},
      {label:'3rd',     v:3, c:'#22c55e'},
      {label:'4th',     v:4, c:'#22c55e'},
      {label:'Reverse', v:5, c:'#ef4444'}
    ];
    gears.forEach(g => {
      const b = document.createElement('button');
      b.className = 'extra-btn' + (g.v === 0 ? ' active' : '');
      b.style.setProperty('--c', g.c);
      b.innerHTML = `<span class="eb-num">${g.label === 'Neutral' ? 'N' : g.label === 'Reverse' ? 'R' : g.v}</span>${g.label}`;
      b.addEventListener('click', () => {
        grid.querySelectorAll('.extra-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        postTo('gearbox', {type:'command', action:'setGear', value:g.v});
        closeSheet();
      });
      grid.appendChild(b);
    });
  }
  else if(id === 'clutch'){
    hasExtras = true;
    const b = document.createElement('button');
    b.className = 'extra-btn';
    b.style.setProperty('--c', '#ef4444');
    b.innerHTML = `<span class="eb-num">⇩</span>Hold pedal`;
    const down = (e) => {
      e.preventDefault();
      b.classList.add('active');
      if(b.setPointerCapture && e.pointerId != null){
        try{ b.setPointerCapture(e.pointerId); }catch(_){}
      }
      postTo('clutch', {type:'command', action:'setPedal', value:1});
    };
    const up = () => {
      b.classList.remove('active');
      postTo('clutch', {type:'command', action:'setPedal', value:0});
    };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    grid.appendChild(b);
  }

  section.style.display = hasExtras ? '' : 'none';
}

/* ─── Module → shell messages ────────────────────────────── */
window.addEventListener('message', (e) => {
  const d = e.data;
  if(!d || d.source !== 'auto-module') return;
  if(d.type === 'ready'){
    const fr = iframes[d.moduleId];
    if(fr) injectEmbedFix(fr);
    sendAllCommands(d.moduleId);
  }
});

/* ─── Keyboard ───────────────────────────────────────────── */
window.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  const inShell = !ae || ae === document.body || ae.tagName === 'BODY';
  if(!inShell) return;

  if(e.key === 'Escape'){
    if(bottomSheet.classList.contains('open')) { closeSheet(); return; }
    if(state.active) closeModule();
    return;
  }
  if(!state.active) return;

  if(e.key === ' ' || e.code === 'Space'){
    if(ae && ae.tagName === 'BUTTON') return;
    e.preventDefault();
    setPlaying(!state.playing);
  } else if(e.key === 'r' || e.key === 'R'){
    postTo(state.active, {type:'command', action:'reset'});
  } else if(e.key === 'l' || e.key === 'L'){
    setTheme(state.theme === 'light' ? 'dark' : 'light');
  } else if(e.key === 'w' || e.key === 'W'){
    setWireframe(!state.wireframe);
  } else if(e.key === 'x' || e.key === 'X'){
    setXRay(!state.xray);
  }
});

/* ─── PWA install ────────────────────────────────────────── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtnEl.hidden = false;
});
installBtnEl.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtnEl.hidden = true;
});
window.addEventListener('appinstalled', () => {
  installBtnEl.hidden = true;
  deferredPrompt = null;
});

/* ─── Service worker ─────────────────────────────────────── */
/* FIX: reload the page exactly once when a new service worker takes
   control. Without this, an already-open/installed PWA can keep
   running its old in-memory JS (from before perf-guard.js existed)
   while the cache underneath has already moved on to the new
   version — causing exactly this kind of "works in a browser tab,
   breaks in the installed app" mismatch. */
if('serviceWorker' in navigator){
  let refreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(refreshedOnce) return;
    refreshedOnce = true;
    location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(err => {
      console.warn('[Auto Lab] SW registration failed:', err);
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
moduleCountEl.textContent = modules.length + ' interactive modules';

applyShellTheme();
pillWire.classList.toggle('active', state.wireframe);
pillXRay.classList.toggle('active', state.xray);
updatePlayIcon();

renderHome('home');

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    bootLoader.classList.add('hidden');
    setTimeout(() => { try{ bootLoader.remove(); }catch(_){} }, 400);
    scheduleIdlePrefetch();
  });
});

const initialHash = location.hash.slice(1);
const initialMod = modules.find(m => m.id === initialHash);
if(initialMod){
  setTimeout(() => openModule(initialMod.id), 60);
}

function scheduleIdlePrefetch(){
  const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 1200));
  let i = 0;
  const step = () => {
    if(i >= modules.length) return;
    const mod = modules[i++];
    if(iframes[mod.id]){ step(); return; }
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = mod.file;
    link.as = 'document';
    document.head.appendChild(link);
    idle(step, {timeout: 2000});
  };
  idle(step, {timeout: 2000});
}

})();
</script>
