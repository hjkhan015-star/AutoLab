<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Engine Cooling System — Auto Lab</title>
<link rel="stylesheet" href="base.css">
<style>
/* Only cooling-specific visuals & layout remain */
#system-flow{margin-top:13px;display:flex;gap:6px;flex-wrap:wrap}
.flow-chip{font-size:11px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.06);
  color:#b8c4d2;transition:.2s}
#fins-note{margin-top:11px;font-size:12px;line-height:1.55;padding:9px 11px;border-radius:9px;display:none}
#fins-note.fins-on{display:block;background:rgba(56,189,248,.10);color:#9dd8f7}
#fins-note.fins-off{display:block;background:rgba(239,68,68,.15);color:#fca5a5}

#top-right-stack{position:fixed;z-index:11;top:18px;right:18px;
  display:flex;flex-direction:column;gap:10px;width:260px;
  background:rgba(13,18,27,.88);border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:12px;backdrop-filter:blur(12px);
  box-shadow:0 12px 35px rgba(0,0,0,.32)}

#control-row{display:flex;gap:6px;align-items:center}
#mode-buttons{display:flex;gap:4px;flex:1;background:rgba(255,255,255,.04);
  padding:3px;border-radius:10px}
.mode-btn{flex:1;padding:8px 6px;border-radius:7px;cursor:pointer;
  border:0;background:transparent;color:#b8c4d2;
  font:700 11px Inter,system-ui;letter-spacing:.02em;
  transition:all .18s cubic-bezier(.4,0,.2,1)}
.mode-btn:hover{color:#e8edf5}
.mode-btn:active{transform:scale(.96)}
.mode-btn.active{background:#38bdf8;color:#07111a;box-shadow:0 3px 12px rgba(56,189,248,.35)}

#btn-fins{width:38px;height:38px;flex:0 0 auto;border-radius:10px;
  border:1px solid rgba(56,189,248,.35);
  background:rgba(56,189,248,.10);color:#7dd3fc;cursor:pointer;
  display:grid;place-items:center;transition:all .18s}
#btn-fins:hover{background:rgba(56,189,248,.20);border-color:rgba(56,189,248,.6)}
#btn-fins:active{transform:scale(.93)}
#btn-fins svg{width:17px;height:17px}
#btn-fins.off{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.14);
  color:#fca5a5;animation:finWarn 2.4s infinite}
@keyframes finWarn{50%{box-shadow:0 0 20px rgba(239,68,68,.4)}}

#temp-compact{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.04);border-radius:11px;
  border:1px solid rgba(255,255,255,.06)}
#temp-value{font-size:22px;font-weight:800;
  font-variant-numeric:tabular-nums;line-height:1;
  transition:color .3s;flex:0 0 auto;min-width:66px}
#temp-bar-wrap{flex:1;min-width:0}
#temp-bar{height:5px;background:rgba(255,255,255,.10);border-radius:10px;overflow:hidden}
#temp-fill{height:100%;width:30%;background:#38bdf8;border-radius:10px;
  transition:width .25s,background .3s}
#temp-status{font-size:10px;margin-top:5px;color:#8d9aaa;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#temp-graph{width:100%;height:26px;margin-top:8px;display:block;overflow:visible}
#temp-graph .gl{stroke:rgba(255,255,255,.08);stroke-width:1;fill:none}
#temp-graph .line{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .3s}
#temp-graph .area{fill:rgba(56,189,248,.10);transition:fill .3s}

#surface-row{padding-top:8px;border-top:1px solid rgba(255,255,255,.06);margin-top:8px}
#surface-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#8d9aaa;
  display:flex;justify-content:space-between;align-items:center}
#surface-title b{color:#e8edf5;letter-spacing:0;text-transform:none;font-size:11px;
  font-variant-numeric:tabular-nums}
#surface-bar{height:4px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;
  margin-top:5px}
#surface-bar-fill{height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#7dd3fc);
  border-radius:10px;transition:width .3s,background .3s}
#surface-bar-fill.off{background:linear-gradient(90deg,#f87171,#fca5a5)}

#overheat-overlay{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;
  transition:opacity .5s;
  background:radial-gradient(ellipse at center, transparent 42%, rgba(239,68,68,.42) 100%)}
#overheat-overlay.on{opacity:1;animation:heatPulse 1.4s infinite}
@keyframes heatPulse{50%{opacity:.55}}

#alert-chip{position:fixed;z-index:11;left:50%;top:22px;
  transform:translateX(-50%) translateY(-14px);
  background:rgba(60,10,10,.95);border:1px solid rgba(239,68,68,.6);color:#fca5a5;
  padding:11px 18px;border-radius:12px;font-weight:750;font-size:13px;letter-spacing:.03em;
  box-shadow:0 10px 30px rgba(239,68,68,.35);opacity:0;pointer-events:none;
  transition:opacity .35s, transform .35s;max-width:calc(100vw - 40px);text-align:center}
#alert-chip.on{opacity:1;transform:translateX(-50%) translateY(0)}

.callout{position:fixed;z-index:6;pointer-events:none;font:600 11px Inter,system-ui;
  padding:4px 8px;border-radius:7px;background:rgba(6,10,16,.86);
  border:1px solid rgba(255,255,255,.14);white-space:nowrap;transform:translate(-50%,-50%);
  display:none}
.callout-dot{position:fixed;z-index:4;width:6px;height:6px;border-radius:50%;
  pointer-events:none;transform:translate(-50%,-50%);background:currentColor;
  box-shadow:0 0 8px currentColor;display:none}
.callout-line{position:fixed;z-index:4;height:1px;pointer-events:none;
  transform-origin:0 50%;background:currentColor;opacity:.55;display:none}

/* Embedded layout tweaks for cooling-specific elements */
body.embedded #top-right-stack {
  position: absolute !important;
  top: calc(var(--shell-header-h, 64px) + 10px) !important;
  right: 12px !important; left: auto !important;
  width: 220px !important; z-index: 15 !important;
  padding: 10px !important; border-radius: 14px !important;
}
@media (max-width: 520px) {
  body.embedded #top-right-stack { width: 180px !important; padding: 8px !important; }
  body.embedded #temp-value { font-size: 18px; min-width: 54px; }
  body.embedded #temp-status { font-size: 9px; }
  body.embedded .mode-btn { font-size: 10px; padding: 7px 4px; }
  body.embedded #btn-fins { width: 34px; height: 34px; }
  body.embedded #btn-fins svg { width: 15px; height: 15px; }
  body.embedded #temp-graph { height: 22px; }
}
body.embedded #legend {
  bottom: calc(var(--shell-pill-h, 64px) + 14px) !important;
  left: 12px !important; z-index: 15 !important;
}
@media (max-width: 700px) {
  body.embedded #legend { display: none !important; }
}
body.embedded #alert-chip {
  top: calc(var(--shell-header-h, 64px) + 12px) !important;
}
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="edu-panel" class="panel">
  <div id="panel-head">
    <div>
      <h1 id="module-kicker">Automotive · Class IX / X</h1>
      <h2 id="module-title">Engine Cooling System</h2>
    </div>
    <button id="panel-toggle" aria-label="Toggle information" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
  </div>
  <div id="panel-body">
    <div id="mode-badge"><span class="dot"></span><span id="mode-name">Air Cooling</span></div>
    <div id="mode-desc"></div>
    <div id="system-flow"></div>
    <div id="fins-note" class="fins-on"></div>
  </div>
</div>

<div id="top-right-stack">
  <div id="control-row">
    <div id="mode-buttons">
      <button class="mode-btn active" id="btn-air">Air</button>
      <button class="mode-btn" id="btn-radiator">Liquid</button>
    </div>
    <button id="btn-fins" aria-pressed="true" aria-label="Toggle cooling fins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="3" y1="14" x2="21" y2="14"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div id="temp-compact">
    <div id="temp-value">70°C</div>
    <div id="temp-bar-wrap">
      <div id="temp-bar"><div id="temp-fill"></div></div>
      <div id="temp-status">Normal operating range</div>
    </div>
  </div>

  <svg id="temp-graph" viewBox="0 0 180 26" preserveAspectRatio="none">
    <line class="gl" x1="0" y1="6"  x2="180" y2="6"/>
    <line class="gl" x1="0" y1="13" x2="180" y2="13"/>
    <line class="gl" x1="0" y1="20" x2="180" y2="20"/>
    <path id="temp-area" class="area" d=""/>
    <path id="temp-line" class="line" d="" stroke="#38bdf8"/>
  </svg>

  <div id="surface-row">
    <div id="surface-title"><span id="surface-label">Surface area</span><b id="surface-mult">3.2× base</b></div>
    <div id="surface-bar"><div id="surface-bar-fill"></div></div>
  </div>
</div>

<div id="overheat-overlay"></div>
<div id="alert-chip">⚠ OVERHEATING — REFIT THE FINS</div>

<div id="legend">
  <div class="legend-row"><span class="sw" style="background:#ff5a32"></span> Hot coolant / hot metal</div>
  <div class="legend-row"><span class="sw" style="background:#36aef0"></span> Cooled coolant / ram air</div>
  <div class="legend-row"><span class="sw" style="background:#fb923c"></span> Air carrying heat away</div>
</div>

<div id="module-controls" class="panel">
  <button class="ctrl-btn" id="btn-play" aria-label="Pause">
    <svg id="icon-play" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <button class="ctrl-btn" id="btn-reset" aria-label="Reset">
    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
  </button>
  <div class="slider-group">
    <span>Speed</span>
    <input type="range" id="speed" min=".05" max="2.5" step=".05" value="1">
    <span id="speed-readout">2800 RPM</span>
  </div>
  <label class="toggle"><input type="checkbox" id="chk-labels" checked> Labels</label>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Switch between air &amp; liquid cooling</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ─────────────────────────────────────────────────────────────
   Base import — namespace form so the standalone bundler can
   rewrite it to a data-URI. Do NOT use a named-import form here;
   see build.py / serve.py for the regex that handles this.
   ───────────────────────────────────────────────────────────── */
import * as Base from './module-base.js';
const {
  buildScene, attachResize, createBridge, createParticleTexture,
  detectEmbed, THREE
} = Base;

/* ═══════════════════════════════════════════════════════════
   SCENE SETUP (Delegated to module-base.js)
   ═══════════════════════════════════════════════════════════ */
const isPortrait = innerWidth / innerHeight < 1;
const { scene, camera, renderer, controls, wrap, baseFov, quality, viewManager } = buildScene({
  camPos: isPortrait ? [7.0, 4.5, 9.0] : [8.5, 5.5, 11.0],
  target: [0, 0.5, 1.7],
  floorY: -2.35,
  fov: 42
});

const { isCoarse, isLowEnd, isMidEnd } = quality;

/* Override specific controls and renderer details for cooling */
controls.minDistance = 4.0;
controls.maxDistance = 32;
controls.rotateSpeed = isCoarse ? 0.55 : 0.9;
controls.zoomSpeed   = isCoarse ? 0.75 : 1.0;
controls.dampingFactor = 0.07;

scene.fog = new THREE.Fog(0x0b0e14, 22, 55); // Cooling uses linear fog
renderer.toneMappingExposure = 1.12;

// Scale up the base floor to match the original 16-unit radius
const floor = scene.children.find(c => c.userData.__isFloor);
if (floor) floor.scale.set(1.8, 1.8, 1.8);

/* Custom lights for cooling module */
const cyanLight = new THREE.PointLight(0x38bdf8, 20, 15, 2);
cyanLight.position.set(-5, 2.8, 4.0); scene.add(cyanLight);
const warmLight = new THREE.PointLight(0xff6a2b, 0, 10, 2);
warmLight.position.set(0, 1.0, 0); scene.add(warmLight);

const particleTex = createParticleTexture();

/* ═══════════════════════════════════════════════════════════
   SCENE GEOMETRY (Air vs Radiator modes)
   ═══════════════════════════════════════════════════════════ */
const metal     = new THREE.MeshStandardMaterial({color:0x596575, roughness:.42, metalness:.72});
const darkMetal = new THREE.MeshStandardMaterial({color:0x252c35, roughness:.48, metalness:.70});
const black     = new THREE.MeshStandardMaterial({color:0x11161d, roughness:.72, metalness:.25});
const blueMat   = new THREE.MeshStandardMaterial({color:0x147bb8, roughness:.30, metalness:.45});
const redMat    = new THREE.MeshStandardMaterial({color:0xa62c28, roughness:.40, metalness:.30});
const copper    = new THREE.MeshStandardMaterial({color:0xc58a35, roughness:.35, metalness:.70});
const white     = new THREE.MeshStandardMaterial({color:0xd9e2eb, roughness:.30, metalness:.50});
const linerMat  = new THREE.MeshStandardMaterial({color:0x2a3038, roughness:.38, metalness:.88});
const pistonMat = new THREE.MeshStandardMaterial({color:0xc8d0da, roughness:.24, metalness:.92});

const barrelBaseColor = new THREE.Color(0xc2cad6);
const headBaseColor   = new THREE.Color(0x9aa2ae);
const finBaseColor    = new THREE.Color(0xd2dae6);
const barrelHotColor  = new THREE.Color(0x7a2410);
const headHotColor    = new THREE.Color(0x5e1a0c);
const finHotColor     = new THREE.Color(0x8a2c14);

const barrelMat = new THREE.MeshStandardMaterial({
  color: barrelBaseColor.clone(), roughness:.38, metalness:.80,
  emissive:0xff3300, emissiveIntensity:0.0
});
const headMat = new THREE.MeshStandardMaterial({
  color: headBaseColor.clone(), roughness:.48, metalness:.72,
  emissive:0xff3300, emissiveIntensity:0.0
});
const finMat = new THREE.MeshStandardMaterial({
  color: finBaseColor.clone(), roughness:.22, metalness:.92,
  emissive:0xff5522, emissiveIntensity:0.0
});

const radiatorFrameMat = new THREE.MeshStandardMaterial({color:0x22282f, metalness:.68, roughness:.44});
const radiatorFinMat   = new THREE.MeshStandardMaterial({color:0x8f9aa5, metalness:.88, roughness:.42});
const serpentineMat    = new THREE.MeshPhysicalMaterial({
  color: 0xc08b3a, metalness: 0.90, roughness: 0.28,
  transparent: true, opacity: 0.66, depthWrite: false,
  side: THREE.DoubleSide
});
const radiatorTankMat  = new THREE.MeshStandardMaterial({color:0x1a1f25, metalness:.16, roughness:.62});
const hoseMat          = new THREE.MeshStandardMaterial({
  color:0x14181c, metalness:.06, roughness:.84,
  transparent:true, opacity:0.66, depthWrite:false
});
const clampMat         = new THREE.MeshStandardMaterial({color:0x8d949b, metalness:.92, roughness:.26});
const shroudMat        = new THREE.MeshStandardMaterial({
  color:0x171b21, metalness:.20, roughness:.70, side:THREE.DoubleSide
});
const fanBladeMat      = new THREE.MeshStandardMaterial({
  color:0xcfd8e2, metalness:.55, roughness:.36, side:THREE.DoubleSide
});

const jacketMat = new THREE.MeshPhysicalMaterial({
  color:0x2b93bf, transparent:true, opacity:.11, roughness:.18, metalness:.10,
  transmission:0.20, side:THREE.DoubleSide, depthWrite:false
});
const blockMat = new THREE.MeshPhysicalMaterial({
  color:0x3a4555, metalness:.55, roughness:.55,
  transparent:true, opacity:.30, depthWrite:false, side:THREE.DoubleSide
});

const system = new THREE.Group();
scene.add(system);

function box(w,h,d,mat,x,y,z,parent=system){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cyl(r,h,mat,x,y,z,seg=32,parent=system){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function tube(a,b,r,mat,parent=system){
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(vb, va);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,dir.length(),20), mat);
  m.position.copy(va).add(vb).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  m.castShadow = true; parent.add(m); return m;
}
function roundedBox(w,h,d,r,mat,parent){
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);  s.quadraticCurveTo(x+w, y,     x+w, y+r);
  s.lineTo(x+w, y+h-r);s.quadraticCurveTo(x+w, y+h,   x+w-r, y+h);
  s.lineTo(x+r, y+h);  s.quadraticCurveTo(x,   y+h,   x,   y+h-r);
  s.lineTo(x, y+r);    s.quadraticCurveTo(x,   y,     x+r, y);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: d, bevelEnabled: true, bevelThickness: 0.012,
    bevelSize: 0.012, bevelSegments: 2, curveSegments: 6
  });
  geo.translate(0, 0, -d/2);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function makeFormedCurve(points, bendRadius) {
  const pts = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const n = pts.length;
  const trims = new Array(n).fill(0);
  for (let i = 1; i < n - 1; i++) {
    const d1 = new THREE.Vector3().subVectors(pts[i], pts[i - 1]).normalize();
    const d2 = new THREE.Vector3().subVectors(pts[i + 1], pts[i]).normalize();
    const ang = Math.acos(THREE.MathUtils.clamp(d1.dot(d2), -1, 1));
    const raw = bendRadius * Math.tan(ang / 2);
    trims[i] = Math.min(raw,
                        pts[i].distanceTo(pts[i - 1]) * 0.45,
                        pts[i].distanceTo(pts[i + 1]) * 0.45);
  }
  const path = new THREE.CurvePath();
  for (let i = 0; i < n - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dir = new THREE.Vector3().subVectors(b, a).normalize();
    const len = a.distanceTo(b);
    const t0 = i === 0 ? 0 : trims[i];
    const t1 = i === n - 2 ? len : len - trims[i + 1];
    const p0 = a.clone().addScaledVector(dir, t0);
    const p1 = a.clone().addScaledVector(dir, t1);
    if (p0.distanceTo(p1) > 1e-5) path.add(new THREE.LineCurve3(p0, p1));
    if (i < n - 2) {
      const nextDir = new THREE.Vector3().subVectors(pts[i + 2], b).normalize();
      const c0 = b.clone().addScaledVector(dir, -trims[i + 1]);
      const c1 = b.clone().addScaledVector(nextDir, trims[i + 1]);
      path.add(new THREE.QuadraticBezierCurve3(c0, b, c1));
    }
  }
  return path;
}

function curveToPolyline(curve, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const p = curve.getPoint(i / n);
    if (!p) continue;
    out.push([p.x, p.y, p.z]);
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════
   AIR-MODE ENGINE
   ═══════════════════════════════════════════════════════════ */
const engine = new THREE.Group(); system.add(engine);
box(3.0, 1.15, 2.0, darkMetal, 0, -.85, 0, engine);
box(2.5, .42, 1.55, black, 0, -1.22, 0, engine);

const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.78, .84, 2.05, 40), barrelMat);
barrel.position.y = .9; barrel.castShadow = true; barrel.receiveShadow = true; engine.add(barrel);

const head = new THREE.Mesh(new THREE.CylinderGeometry(.95, .95, .42, 36), headMat);
head.position.y = 2.13; head.castShadow = true; engine.add(head);

cyl(.07, .30, white, 0, 2.47, 0, 12, engine);
cyl(.045, .14, copper, 0, 2.65, 0, 10, engine);

tube([.6,1.3,-.5],[1.9,.72,-1.05], .13, redMat, engine);
box(1.05, .34, .36, metal, 2.7, .66, -1.22, engine);
tube([-.6,1.65,-.35],[-1.9,2.0,-.62], .15, blueMat, engine);

const fins = new THREE.Group(); engine.add(fins);
const finCount = 11;
const finSpacing = 0.175;
const finBaseY = 0.10;
const FIN_MULTIPLIER = 3.2;

for (let i = 0; i < finCount; i++) {
  const f = new THREE.Mesh(
    new THREE.CylinderGeometry(1.18, 1.18, 0.05, isLowEnd ? 24 : 48, 1, false), finMat);
  f.position.y = finBaseY + i * finSpacing;
  f.castShadow = true; f.receiveShadow = true;
  fins.add(f);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.18, 0.012, 6, isLowEnd ? 24 : 48), darkMetal);
  edge.rotation.x = Math.PI / 2; edge.position.y = f.position.y; fins.add(edge);
}
for (let i = 0; i < 3; i++) {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(1.10, 1.10, 0.045, 40), finMat);
  f.position.y = 1.99 + i * 0.155; f.castShadow = true; fins.add(f);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.10, 0.010, 6, 40), darkMetal);

const C_COOL = new THREE.Color(0x3aa8f0);
const C_WARM = new THREE.Color(0xffc24d);
const C_HOT  = new THREE.Color(0xff3f1c);
function heatColor(h, out) {
  h = h < 0 ? 0 : h > 1 ? 1 : h;
  if (h <= 0.5) out.copy(C_COOL).lerp(C_WARM, h * 2);
  else          out.copy(C_WARM).lerp(C_HOT, (h - 0.5) * 2);
  return out;
}

function makeHoseStream(curve, h0, h1) {
  const geo = new THREE.TubeGeometry(curve, 180, 0.074, 8, false);
  const uv = geo.attributes.uv;
  const count = geo.attributes.position.count;
  const colors = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = uv.getX(i);
    heatColor(h0 + (h1 - h0) * u, c);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = 2;
  return m;
}

const _pv = new THREE.Vector3();
function polylineSampler(ptsArr, h0, h1) {
  const pts = ptsArr.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const n = pts.length - 1;
  const seg = new Array(n);
  let total = 0;
  for (let i = 0; i < n; i++) { seg[i] = pts[i].distanceTo(pts[i + 1]); total += seg[i]; }
  return function (t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    let d = t * total, i = 0;
    while (i < n - 1 && d > seg[i]) { d -= seg[i]; i++; }
    const u = seg[i] > 0 ? d / seg[i] : 0;
    _pv.lerpVectors(pts[i], pts[i + 1], u);
    return { pos: _pv, h: h0 + (h1 - h0) * t };
  };
}

  shimmer.push({
    t: Math.random(),
    x0: Math.random() * 1.6 - 0.8,
    z0: Math.random() * 1.6 - 0.8,
    ph: Math.random() * 7
  });
}

const streakGroup = new THREE.Group(); scene.add(streakGroup);
const streakGeo = new THREE.BoxGeometry(1.6, .03, .03);
const streaks = [];
for (let i = 0; i < 14; i++) {

  }));

  m.position.z = (Math.random() < .5 ? -1 : 1) * (1.6 + Math.random() * 3.0);

}

/* ═══════════════════════════════════════════════════════════

const callouts = [];
function addCallout(text, anchor, offset, color, modes) {
  const label = document.createElement('div');
  label.className = 'callout';
  label.textContent = text;
  label.style.color = color;
  document.body.appendChild(label);

  const dot = document.createElement('div');
  dot.className = 'callout-dot';
  dot.style.color = color;
  document.body.appendChild(dot);

  const line = document.createElement('div');
  line.className = 'callout-line';
  line.style.color = color;
  document.body.appendChild(line);

  callouts.push({
    label, dot, line,
    anchor: new THREE.Vector3(anchor[0], anchor[1], anchor[2]),
    offset, modes
  });
}

function updateReadout() {

function updateFinsUI() {
  btnFins.classList.toggle('off', !state.fins);
  btnFins.setAttribute('aria-pressed', state.fins);
  fins.visible = state.fins;
  if (state.mode !== 'air') return;

  surfaceLabel.textContent = 'Surface area';
  surfaceMult.textContent = (state.fins ? FIN_MULTIPLIER : 1.0).toFixed(1) + '× base';
  surfaceBarFill.style.width = (state.fins ? 100 : 31) + '%';
  surfaceBarFill.classList.toggle('off', !state.fins);

  if (state.fins) {
    finsNote.className = 'fins-on';
    finsNote.textContent = '✓ Cooling fins attached — they expose about 3.2× more surface to the ram air, so heat escapes quickly even at moderate speed.';
  } else {
    finsNote.className = 'fins-off';
    finsNote.textContent = '⚠ Fins removed — the bare cylinder can reject only about 1/3 of the heat. Even at maximum engine speed it overheats. Surface area is what makes air cooling work!';
  }
}

function rebuildMode() {
  const air = state.mode === 'air';
  engine.visible = air;
  radSys.visible = !air;
  streakGroup.visible = air;
  btnFins.style.display = air ? 'grid' : 'none';
  document.getElementById('btn-air').classList.toggle('active', air);
  document.getElementById('btn-radiator').classList.toggle('active', !air);

  modeBadge.classList.toggle('radiator', !air);
  const info = modeInfo[state.mode];
  modeName.textContent = info.name;
  modeDesc.innerHTML = info.desc;
  systemFlow.innerHTML = info.flow.map(x => `<span class="flow-chip">${x}</span>`).join('');

  if (!air) {
    finsNote.className = '';
    finsNote.style.display = 'none';
    surfaceLabel.textContent = 'Thermostat status';
    surfaceMult.textContent = 'Regulating';
    surfaceBarFill.style.width = '100%';
    surfaceBarFill.classList.remove('off');
  } else {
    finsNote.style.display = '';
    updateFinsUI();
  }
  camGoal = CAM[state.mode];
  updateSim(0);
}

/* Info panel toggle */
const eduPanel = document.getElementById('edu-panel');
document.getElementById('panel-toggle').onclick = (e) => {

document.getElementById('btn-air').onclick = () => { state.mode = 'air'; rebuildMode(); };
document.getElementById('btn-radiator').onclick = () => { state.mode = 'radiator'; rebuildMode(); };
btnFins.onclick = () => { state.fins = !state.fins; updateFinsUI(); };

document.getElementById('btn-play').onclick = () => {
  state.playing = !state.playing;
  document.getElementById('icon-play').style.display  = state.playing ? 'none' : 'block';
  document.getElementById('icon-pause').style.display = state.playing ? 'block' : 'none';
};
document.getElementById('btn-reset').onclick = () => {
  state.time = 0; state.temp = 70; state.fins = true;
  tempHistory.fill(70);
  updateFinsUI();
};

  state.speed = +e.target.value;
  updateReadout();
};
document.getElementById('chk-labels').onchange = (e) => { state.labels = e.target.checked; };

/* ── Shell bridge (Using module-base.js) ─────────────────── */
const bridge = createBridge('cooling', (d) => {
  switch (d.action) {
    case 'setPlaying':
      state.playing = !!d.value;
      document.getElementById('icon-play').style.display  = state.playing ? 'none' : 'block';
      document.getElementById('icon-pause').style.display = state.playing ? 'block' : 'none';
      break;
    case 'setSpeed':
      state.speed = +d.value;
      const sp = document.getElementById('speed');
      if (sp) sp.value = d.value;
      updateReadout();
      break;
    case 'setLabels':
      state.labels = !!d.value;
      const cl = document.getElementById('chk-labels');
      if (cl) cl.checked = state.labels;
      break;
    case 'reset':
      document.getElementById('btn-reset').click();
      break;
  }
});
bridge.ready();
bridge.setStatus('Air Cooling', '#38bdf8');

function targetTemp() {
  const sp = state.speed;
  if (state.mode === 'radiator') return 87 + Math.max(0, sp - 1) * 2.5;
  const load = 24 + 36 * sp;
  const ram  = 1.6 * sp * (state.fins ? 1.0 : 0.33);
  return Math.min(135, 30 + load / Math.max(0.05, ram));
}

const _col = new THREE.Color();

function updateRadiatorCoolant(dt) {
  const pump = 0.45 + 0.85 * state.speed;
  const posAttr = coolantGeo.attributes.position;
  const colAttr = coolantGeo.attributes.color;

  for (let i = 0; i < coolant.length; i++) {
    const p = coolant[i];
    p.t += dt * STAGE_RATE[p.stage] * pump * p.speed;

    let guard = 0;
    while (p.t >= 1 && guard++ < 4) {
      p.t -= 1;
      p.stage = (p.stage + 1) & 3;
    }
    if (p.t >= 1) p.t = 0;

    let r;
    if (p.stage === 0)      r = stageJacket(p.t);
    else if (p.stage === 1) r = stageUpper(p.t);
    else if (p.stage === 2) r = stageSerp(p.t);
    else                    r = stageReturn(p.t);

    posAttr.setXYZ(i,
      r.pos.x + Math.sin(state.time * 38 + p.ph) * 0.015,
      r.pos.y + Math.cos(state.time * 31 + p.ph * 1.3) * 0.015,
      r.pos.z + Math.cos(state.time * 34 + p.ph) * 0.015
    );

    heatColor(r.h, _col);
    colAttr.setXYZ(i, _col.r, _col.g, _col.b);
  }
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
}

function updateRadiatorAir(dt) {
  const flow = 0.55 + 1.2 * state.speed;
  for (let i = 0; i < AIR_STREAKS; i++) {
    const d = airData[i];
    d.z -= dt * d.speed * flow;
    if (d.z < AIR_BACK) {
      d.z = AIR_FRONT - Math.random() * 0.9;
      d.x = RAD_CX + (Math.random() - 0.5) * 1.95;
      d.y = RAD_CY + (Math.random() - 0.5) * 2.6;
    }
    const X = d.x, Y = d.y;
    const i6 = i * 6;
    airPositions[i6]     = X; airPositions[i6 + 1] = Y; airPositions[i6 + 2] = d.z;
    airPositions[i6 + 3] = X; airPositions[i6 + 4] = Y; airPositions[i6 + 5] = d.z - 0.32;
  }
  airGeo.attributes.position.needsUpdate = true;
  airLines.material.opacity = 0.12 + 0.22 * Math.min(1, state.speed);
}

function updateRadiatorHeat() {
  const heat = THREE.MathUtils.clamp((state.temp - 85) / 35, 0, 1);
  heatOverlay.material.opacity = 0.02 + heat * 0.07;
}

function updateSim(dt) {
  const s = state.speed;
  state.temp += (targetTemp() - state.temp) * Math.min(1, dt * 0.35);

  const pulse = 1 + 0.08 * Math.sin(state.time * 6);
  const heat    = THREE.MathUtils.clamp((state.temp - 85) / 35, 0, 1);
  const finHeat = heat * 0.6;

  barrelMat.color.copy(barrelBaseColor).lerp(barrelHotColor, heat);
  headMat.color.copy(headBaseColor).lerp(headHotColor, heat);
  finMat.color.copy(finBaseColor).lerp(finHotColor, finHeat);

  barrelMat.emissiveIntensity = heat * 0.22 * pulse;
  headMat.emissiveIntensity   = heat * 0.14 * pulse;
  finMat.emissiveIntensity    = (state.mode === 'air' && state.fins)
                                  ? finHeat * 0.18 * pulse : 0.0;

  warmLight.intensity = heat * 16 * pulse;

  if (state.mode === 'radiator' && state.playing) {
    for (let i = 0; i < pistons.length; i++) {
      const phase = state.time * 3 + i * Math.PI / 2;
      pistons[i].position.y = 0.2 + Math.sin(phase) * 0.28;
    }
  }

  radFan.spinner.rotation.z -= dt * (2.5 + 14 * s);

  if (state.mode === 'air') {
    const airStrength = Math.min(1, 0.15 + 0.85 * s);
    const finPickup   = state.fins ? 1.0 : 0.42;
    const posAttr = airflowGeo.attributes.position;
    const colAttr = airflowGeo.attributes.color;
    const tmpC = new THREE.Color();

    for (let i = 0; i < airflow.length; i++) {
      const p = airflow[i];
      p.t = (p.t + dt * (0.04 + 0.20 * s)) % 1;
      const x = -3.6 + p.t * 8.0;
      const hIn  = THREE.MathUtils.clamp((x + 1.35) / 1.9, 0, 1);
      const hOut = THREE.MathUtils.clamp((1.60 - x) / 1.4, 0, 1);
      const heatCurve = Math.min(hIn, hOut);
      const airHeat = heatCurve * p.heatMax * finPickup * (0.3 + 0.7 * heat);
      const rise = Math.max(0, x - 1.1) * 0.34 * airHeat;

      posAttr.setXYZ(i,
        x + Math.sin(state.time * 2.2 + p.ph) * 0.05,
        p.y0 + rise,
        p.z0 + Math.sin(p.ph * 3.1) * 0.13 * airHeat
      );

      if (airHeat < 0.5) tmpC.copy(C_AIR).lerp(C_AIRMID, airHeat * 2);
      else               tmpC.copy(C_AIRMID).lerp(C_AIRHOT, (airHeat - 0.5) * 2);

      const op = Math.min(1, p.t * 7) * Math.min(1, (1 - p.t) * 4) * airStrength;
      colAttr.setXYZ(i, tmpC.r * op, tmpC.g * op, tmpC.b * op);
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    airflowPoints.visible = true;

    const hf    = THREE.MathUtils.clamp((state.temp - 85) / 30, 0, 1);
    const smoke = THREE.MathUtils.clamp((state.temp - 110) / 22, 0, 1);
    const sPos = shimmerGeo.attributes.position;
    const sCol = shimmerGeo.attributes.color;
    const smC = new THREE.Color();

    for (let i = 0; i < shimmer.length; i++) {
      const p = shimmer[i];
      if (i > shimmer.length * hf) {
        sPos.setXYZ(i, 0, -999, 0);
        continue;
      }
      p.t = (p.t + dt * 0.32) % 1;
      sPos.setXYZ(i,
        p.x0 + Math.sin(p.t * 5 + p.ph) * 0.16 + p.t * 0.55,
        2.42 + p.t * 1.75,
        p.z0 + Math.cos(p.t * 4 + p.ph) * 0.14
      );
      smC.copy(C_SHIMMER).lerp(C_SMOKE, smoke);
      const op = (1 - p.t);
      sCol.setXYZ(i, smC.r * op, smC.g * op, smC.b * op);
    }
    sPos.needsUpdate = true;
    sCol.needsUpdate = true;
    shimmerPoints.visible = true;

    coolantPoints.visible = false;
    airLines.visible = false;

    for (const p of streaks) {
      p.t = (p.t + dt * (0.18 + 0.5 * s)) % 1;
      p.m.position.x = -7.5 + p.t * 15;
      p.m.material.opacity =
        Math.min(1, p.t * 6) * Math.min(1, (1 - p.t) * 6) *
        Math.min(1, 0.4 + 0.6 * s) * 0.42;
    }

  } else {
    airflowPoints.visible = false;
    shimmerPoints.visible = false;

    airLines.visible = true;

    updateRadiatorCoolant(dt);
    updateRadiatorAir(dt);
    updateRadiatorHeat();
  }
}

function updateTempCard() {
  const t = state.temp + Math.sin(state.time * 1.4) * 1.6;
  tempValue.textContent = Math.round(t) + '°C';
  tempFill.style.width = THREE.MathUtils.clamp((t - 45) / 75 * 100, 4, 100) + '%';

  let c, label;
  if (t < 88) { c = '#38bdf8'; label = 'Normal operating range'; }
  else if (t < 100) { c = '#fbbf24'; label = 'Running warm'; }
  else {
    c = '#f87171';
    if (state.mode === 'radiator') label = 'OVERHEATING — check coolant';
    else label = state.fins ? 'OVERHEATING — raise speed' : 'OVERHEATING — refit fins';
  }
  tempValue.style.color = c;
  tempFill.style.background = c;
  tempStatus.textContent = label;
  tempStatus.style.color = c;

  const isOverheat = t > 105;
  overheat.classList.toggle('on', isOverheat);
  alertChip.classList.toggle('on', isOverheat);
  if (isOverheat) {
    if (state.mode === 'radiator') alertChip.textContent = '⚠ OVERHEATING — CHECK COOLANT';
    else alertChip.textContent = state.fins
      ? '⚠ OVERHEATING — RAISE ENGINE SPEED'
      : '⚠ OVERHEATING — REFIT THE FINS';
  }

  if (state.playing) {
    tempHistory.push(state.temp);
    if (tempHistory.length > HIST) tempHistory.shift();
  }

  const lo = 55, hi = 125;
  let dLine = '', dArea = '';
  for (let i = 0; i < tempHistory.length; i++) {
    const x = (i / (HIST - 1)) * 180;
    const v = THREE.MathUtils.clamp((tempHistory[i] - lo) / (hi - lo), 0, 1);
    const y = 24 - v * 21;
    dLine += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  }
  if (tempHistory.length > 1) dArea = dLine + 'L180 24 L0 24 Z';
  tempLine.setAttribute('d', dLine);
  tempArea.setAttribute('d', dArea);
  tempLine.setAttribute('stroke', c);
  tempArea.setAttribute('fill',
    t < 88 ? 'rgba(56,189,248,.10)' :
    t < 100 ? 'rgba(251,191,36,.12)' :
              'rgba(248,113,113,.14)');
}

const _proj = new THREE.Vector3();
function projectLabels() {
  if (state.frame % 2 !== 0) return;
  for (const co of callouts) {
    _proj.copy(co.anchor).project(camera);
    const visible = state.labels && co.modes.includes(state.mode) && _proj.z < 1;
    const d = visible ? 'block' : 'none';
    co.label.style.display = d;
    co.dot.style.display = d;
    co.line.style.display = d;
    if (!visible) continue;

    const ax = (_proj.x * .5 + .5) * innerWidth;
    const ay = (-_proj.y * .5 + .5) * innerHeight;
    const lx = ax + co.offset[0];
    const ly = ay + co.offset[1];

    co.dot.style.left = ax + 'px';
    co.dot.style.top  = ay + 'px';
    co.label.style.left = lx + 'px';
    co.label.style.top  = ly + 'px';

    const dx = lx - ax, dy = ly - ay;
    co.line.style.left = ax + 'px';
    co.line.style.top  = ay + 'px';
    co.line.style.width = Math.hypot(dx, dy).toFixed(1) + 'px';
    co.line.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  }
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  state.frame++;
  const dt = Math.min(clock.getDelta(), .05);

  if (camGoal) {
    const k = 1 - Math.exp(-dt * 2.6);
    camera.position.lerp(camGoal.pos, k);
    controls.target.lerp(camGoal.target, k);
    if (camera.position.distanceTo(camGoal.pos) < 0.06) camGoal = null;
  }

  if (state.playing) {
    state.time += dt * state.speed;
    updateSim(dt);
  } else {
    const heat = THREE.MathUtils.clamp((state.temp - 85) / 35, 0, 1);
    const finHeat = heat * 0.6;
    barrelMat.color.copy(barrelBaseColor).lerp(barrelHotColor, heat);
    headMat.color.copy(headBaseColor).lerp(headHotColor, heat);
    finMat.color.copy(finBaseColor).lerp(finHotColor, finHeat);
    barrelMat.emissiveIntensity = heat * 0.22;
    headMat.emissiveIntensity   = heat * 0.14;
    finMat.emissiveIntensity    = (state.mode === 'air' && state.fins) ? finHeat * 0.18 : 0.0;
    warmLight.intensity = heat * 16;
    radFan.spinner.rotation.z -= dt * (2.5 + 14 * state.speed);
  }

  const now = performance.now() * 0.001;
  cyanLight.intensity = 18 + Math.sin(now * 1.3) * 4;

  updateTempCard();
  projectLabels();
  controls.update();
  renderer.render(scene, camera);
}

rebuildMode();
updateReadout();
attachResize(camera, renderer, wrap, baseFov);
animate();
</script>
